<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест загрузки видео — ИК ЦТ</title>
    <style>
        :root {
            --bg-color: #0f0f23;
            --card-bg: #1a1a2e;
            --text-color: #e4e4e7;
            --text-muted: #71717a;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --success: #22c55e;
            --danger: #ef4444;
            --border: #27272a;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo {
            display: inline-block;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 16px;
            padding: 12px 24px;
            border: 2px solid rgba(99, 102, 241, 0.3);
            border-radius: 12px;
        }
        
        .header h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
        }
        
        .header .subtitle {
            color: var(--text-muted);
        }
        
        .test-badge {
            display: inline-block;
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-top: 8px;
        }
        
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }
        
        .upload-zone {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 50px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }
        
        .upload-zone:hover {
            border-color: var(--accent);
            background: rgba(99, 102, 241, 0.05);
        }
        
        .upload-zone.dragover {
            border-color: var(--accent);
            background: rgba(99, 102, 241, 0.1);
        }
        
        .upload-zone.has-file {
            border-color: var(--success);
            background: rgba(34, 197, 94, 0.05);
        }
        
        .upload-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }
        
        .upload-text {
            font-size: 1.1rem;
            margin-bottom: 8px;
        }
        
        .upload-hint {
            color: var(--text-muted);
        }
        
        .file-info {
            display: none;
            background: rgba(99, 102, 241, 0.1);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
        }
        
        .file-info.visible {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .file-info .icon {
            font-size: 32px;
        }
        
        .file-info .details {
            flex: 1;
        }
        
        .file-info .name {
            font-weight: 600;
            word-break: break-all;
        }
        
        .file-info .size {
            color: var(--text-muted);
        }
        
        .file-info .remove {
            background: none;
            border: none;
            color: var(--danger);
            font-size: 24px;
            cursor: pointer;
        }
        
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: var(--accent);
            color: white;
        }
        
        .btn-primary:hover:not(:disabled) {
            background: var(--accent-hover);
        }
        
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .progress-container {
            display: none;
            margin-bottom: 20px;
        }
        
        .progress-container.visible {
            display: block;
        }
        
        .progress-bar {
            height: 10px;
            background: var(--border);
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), #8b5cf6);
            border-radius: 5px;
            transition: width 0.3s;
            width: 0%;
        }
        
        .progress-text {
            text-align: center;
            color: var(--text-muted);
        }
        
        .result {
            display: none;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
        }
        
        .result.visible {
            display: block;
        }
        
        .result.success {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid var(--success);
        }
        
        .result.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
        }
        
        .result h3 {
            margin-bottom: 12px;
        }
        
        .result.success h3 {
            color: var(--success);
        }
        
        .result.error h3 {
            color: var(--danger);
        }
        
        .result a {
            color: var(--accent);
            word-break: break-all;
        }
        
        .result .info {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        
        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">ИК ЦТ</div>
            <h1>🧪 Тестовая загрузка видео</h1>
            <p class="subtitle">Проверка работы без привязки к БД</p>
            <span class="test-badge">⚠️ ТЕСТОВЫЙ РЕЖИМ</span>
        </div>
        
        <div class="card">
            <div class="upload-zone" id="upload-zone">
                <div class="upload-icon">📁</div>
                <div class="upload-text">Нажмите или перетащите видео</div>
                <div class="upload-hint">MP4, MOV, AVI, MKV, WebM • до 500 МБ</div>
            </div>
            
            <input type="file" id="file-input" accept="video/*">
            
            <div class="file-info" id="file-info">
                <span class="icon">🎬</span>
                <div class="details">
                    <div class="name" id="file-name"></div>
                    <div class="size" id="file-size"></div>
                </div>
                <button class="remove" id="remove-file">✕</button>
            </div>
            
            <div class="progress-container" id="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <div class="progress-text" id="progress-text">Загрузка: 0%</div>
            </div>
            
            <button class="btn btn-primary" id="upload-btn" disabled>
                🚀 Загрузить тестовое видео
            </button>
            
            <div class="result" id="result">
                <h3 id="result-title"></h3>
                <p id="result-message"></p>
                <div class="info" id="result-info"></div>
            </div>
        </div>
    </div>
    
    <script>
        const API_URL = window.location.origin + '/api/v1';
        
        const uploadZone = document.getElementById('upload-zone');
        const fileInput = document.getElementById('file-input');
        const fileInfo = document.getElementById('file-info');
        const fileName = document.getElementById('file-name');
        const fileSize = document.getElementById('file-size');
        const removeFile = document.getElementById('remove-file');
        const uploadBtn = document.getElementById('upload-btn');
        const progressContainer = document.getElementById('progress-container');
        const progressFill = document.getElementById('progress-fill');
        const progressText = document.getElementById('progress-text');
        const result = document.getElementById('result');
        const resultTitle = document.getElementById('result-title');
        const resultMessage = document.getElementById('result-message');
        const resultInfo = document.getElementById('result-info');
        
        let selectedFile = null;
        
        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' Б';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' КБ';
            return (bytes / (1024 * 1024)).toFixed(1) + ' МБ';
        }
        
        function handleFileSelect(file) {
            result.classList.remove('visible', 'success', 'error');
            
            const allowedExtensions = ['.mp4', '.mov', '.avi', '.mkv', '.webm'];
            const ext = '.' + file.name.split('.').pop().toLowerCase();
            
            if (!allowedExtensions.includes(ext)) {
                showResult(false, 'Неподдерживаемый формат', 'Разрешены: MP4, MOV, AVI, MKV, WebM');
                return;
            }
            
            const maxSize = 500 * 1024 * 1024;
            if (file.size > maxSize) {
                showResult(false, 'Файл слишком большой', 'Максимум: 500 МБ');
                return;
            }
            
            selectedFile = file;
            fileName.textContent = file.name;
            fileSize.textContent = formatFileSize(file.size);
            fileInfo.classList.add('visible');
            uploadZone.classList.add('has-file');
            uploadBtn.disabled = false;
        }
        
        function clearFile() {
            selectedFile = null;
            fileInput.value = '';
            fileInfo.classList.remove('visible');
            uploadZone.classList.remove('has-file');
            uploadBtn.disabled = true;
        }
        
        function showResult(success, title, message, info = '') {
            result.classList.remove('success', 'error');
            result.classList.add('visible', success ? 'success' : 'error');
            resultTitle.textContent = (success ? '✅ ' : '❌ ') + title;
            resultMessage.innerHTML = message;
            resultInfo.innerHTML = info;
        }
        
        async function uploadVideo() {
            if (!selectedFile) return;
            
            uploadBtn.disabled = true;
            progressContainer.classList.add('visible');
            result.classList.remove('visible');
            
            const formData = new FormData();
            formData.append('file', selectedFile);
            
            const xhr = new XMLHttpRequest();
            
            xhr.upload.addEventListener('progress', (e) => {
                if (e.lengthComputable) {
                    const percent = Math.round((e.loaded / e.total) * 100);
                    progressFill.style.width = percent + '%';
                    progressText.textContent = `Загрузка: ${percent}%`;
                }
            });
            
            xhr.addEventListener('load', () => {
                progressContainer.classList.remove('visible');
                
                if (xhr.status === 200) {
                    const response = JSON.parse(xhr.responseText);
                    const fullUrl = window.location.origin + response.url;
                    showResult(
                        true,
                        'Видео загружено!',
                        `Размер: <strong>${response.size_mb} МБ</strong>`,
                        `📁 Файл: <code>${response.filename}</code><br>
                         🔗 Ссылка: <a href="${fullUrl}" target="_blank">${fullUrl}</a>`
                    );
                    clearFile();
                } else {
                    try {
                        const error = JSON.parse(xhr.responseText);
                        showResult(false, 'Ошибка', error.detail || 'Неизвестная ошибка');
                    } catch {
                        showResult(false, 'Ошибка', 'Статус: ' + xhr.status);
                    }
                    uploadBtn.disabled = false;
                }
            });
            
            xhr.addEventListener('error', () => {
                progressContainer.classList.remove('visible');
                showResult(false, 'Ошибка сети', 'Проверьте подключение');
                uploadBtn.disabled = false;
            });
            
            xhr.open('POST', `${API_URL}/video/test-upload`);
            xhr.send(formData);
        }
        
        // Events
        uploadZone.addEventListener('click', () => fileInput.click());
        
        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });
        
        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('dragover');
        });
        
        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                handleFileSelect(e.dataTransfer.files[0]);
            }
        });
        
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileSelect(e.target.files[0]);
            }
        });
        
        removeFile.addEventListener('click', clearFile);
        uploadBtn.addEventListener('click', uploadVideo);
    </script>
</body>
</html>
