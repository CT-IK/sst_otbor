<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление проводящими собесы</title>
    
    <style>
        :root {
            --bg-color: #0f0f23;
            --card-bg: #1a1a2e;
            --text-color: #e4e4e7;
            --text-muted: #71717a;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --border: #27272a;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }
        
        .header h1 {
            font-size: 1.75rem;
            font-weight: 600;
        }
        
        .header .faculty-name {
            color: var(--accent);
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            border: none;
            background: var(--accent);
            color: white;
        }
        
        .btn:hover {
            background: var(--accent-hover);
        }
        
        .btn-danger {
            background: var(--danger);
        }
        
        .btn-danger:hover {
            background: #dc2626;
        }
        
        .btn-secondary {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border);
        }
        
        .btn-secondary:hover {
            border-color: var(--accent);
        }
        
        /* Tabs */
        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }
        
        .tab {
            padding: 0.75rem 1.5rem;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-bottom: none;
            color: var(--text-muted);
            transition: all 0.2s;
            font-weight: 500;
        }
        
        .tab:hover {
            color: var(--text-color);
            background: rgba(99, 102, 241, 0.1);
        }
        
        .tab.active {
            background: var(--card-bg);
            color: var(--accent);
            border-color: var(--accent);
            border-bottom-color: var(--card-bg);
            position: relative;
            z-index: 1;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        /* Schedule Table */
        .schedule-container {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
        }
        
        .schedule-table-wrapper {
            overflow-x: auto;
        }
        
        .schedule-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        
        .schedule-table th {
            background: rgba(99, 102, 241, 0.1);
            padding: 0.75rem;
            text-align: center;
            border: 1px solid var(--border);
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.75rem;
            white-space: nowrap;
        }
        
        .schedule-table th:first-child {
            text-align: left;
            position: sticky;
            left: 0;
            background: rgba(99, 102, 241, 0.15);
            z-index: 2;
        }
        
        .schedule-table td {
            padding: 0.5rem;
            text-align: center;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s;
            min-width: 60px;
        }
        
        .schedule-table td:first-child {
            text-align: left;
            position: sticky;
            left: 0;
            background: var(--card-bg);
            z-index: 1;
            font-weight: 500;
            padding-left: 1rem;
        }
        
        .schedule-table td:hover {
            background: rgba(99, 102, 241, 0.1);
        }
        
        .schedule-cell {
            width: 100%;
            height: 100%;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            font-weight: 600;
            font-size: 1.1rem;
        }
        
        .schedule-cell.available {
            background: rgba(34, 197, 94, 0.3);
            color: var(--success);
            border: 2px solid var(--success);
        }
        
        .schedule-cell.busy {
            background: rgba(239, 68, 68, 0.3);
            color: var(--danger);
            border: 2px solid var(--danger);
        }
        
        .schedule-cell.after-interview {
            border: 3px solid var(--warning) !important;
        }
        
        .schedule-cell.empty {
            background: var(--bg-color);
            color: var(--text-muted);
            border: 1px dashed var(--border);
        }
        
        .schedule-cell.empty:hover {
            background: rgba(99, 102, 241, 0.1);
            border-color: var(--accent);
        }
        
        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal-overlay.active {
            display: flex;
        }
        
        .modal {
            background: var(--card-bg);
            border-radius: 12px;
            max-width: 400px;
            width: 90%;
            padding: 2rem;
            border: 1px solid var(--border);
        }
        
        .modal h2 {
            margin-bottom: 1.5rem;
        }
        
        .form-group {
            margin-bottom: 1rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        
        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 1rem;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        .modal-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }
        
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem;
            color: var(--text-muted);
        }
        
        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 1rem;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .save-btn {
            margin-top: 1.5rem;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Управление проводящими собесы — <span class="faculty-name" id="facultyName">...</span></h1>
            <div style="display: flex; gap: 1rem; align-items: center;">
                <a href="/admin" class="btn btn-secondary" style="text-decoration: none;">← Назад к ответам</a>
                <button class="btn" onclick="showAddModal()">➕ Добавить проводящего</button>
            </div>
        </div>
        
        <div id="loading" class="loading">
            <div class="spinner"></div>
            Загрузка...
        </div>
        
        <div id="content" style="display: none;">
            <div class="tabs" id="tabs"></div>
            
            <div id="tabContents"></div>
        </div>
    </div>
    
    <!-- Modal для добавления проводящего -->
    <div class="modal-overlay" id="addModal">
        <div class="modal">
            <h2>Добавить проводящего</h2>
            <div class="form-group">
                <label>Telegram ID</label>
                <input type="number" id="telegramIdInput" placeholder="123456789">
            </div>
            <div class="modal-actions">
                <button class="btn" onclick="addInterviewer()">Добавить</button>
                <button class="btn btn-secondary" onclick="hideAddModal()">Отмена</button>
            </div>
        </div>
    </div>
    
    <!-- Modal для редактирования имени -->
    <div class="modal-overlay" id="editNameModal">
        <div class="modal">
            <h2>Изменить имя</h2>
            <div class="form-group">
                <label>Имя проводящего</label>
                <input type="text" id="nameInput" placeholder="Введите имя (можно оставить пустым)">
            </div>
            <div class="modal-actions">
                <button class="btn" onclick="saveName()">Сохранить</button>
                <button class="btn btn-secondary" onclick="hideEditNameModal()">Отмена</button>
            </div>
        </div>
    </div>
    
    <script>
        const API_BASE = '/api/v1';
        let facultyId = null;
        let interviewers = [];
        let currentInterviewerId = null;
        let scheduleData = {};
        
        // Даты: 2-7 февраля 2026
        const dates = [
            new Date('2026-02-02'),
            new Date('2026-02-03'),
            new Date('2026-02-04'),
            new Date('2026-02-05'),
            new Date('2026-02-06'),
            new Date('2026-02-07')
        ];
        
        // Время: 10:00-21:00 (обычное), 20:00-21:00 (после собес)
        const timeSlots = [];
        for (let h = 10; h <= 21; h++) {
            timeSlots.push({
                hour: h,
                time: `${h.toString().padStart(2, '0')}:00`,
                isAfterInterview: h >= 20
            });
        }
        
        // Получаем параметры из URL или localStorage
        const urlParams = new URLSearchParams(window.location.search);
        let telegramId = urlParams.get('telegram_id') || localStorage.getItem('admin_telegram_id');
        facultyId = parseInt(urlParams.get('faculty_id') || localStorage.getItem('admin_faculty_id'));
        
        if (!facultyId || !telegramId) {
            // Пробуем авторизоваться через API (если есть сохранённые данные)
            if (localStorage.getItem('admin_username')) {
                // Показываем форму авторизации
                showAuthForm();
            } else {
                document.getElementById('loading').innerHTML = 'Ошибка: не указаны параметры faculty_id и telegram_id';
            }
        } else {
            // Сохраняем в localStorage для удобства
            localStorage.setItem('admin_telegram_id', telegramId);
            localStorage.setItem('admin_faculty_id', facultyId);
            loadData();
        }
        
        function showAuthForm() {
            document.getElementById('content').innerHTML = `
                <div style="max-width: 400px; margin: 100px auto; padding: 2rem; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border);">
                    <h2 style="margin-bottom: 1.5rem; text-align: center;">🔐 Вход</h2>
                    <div class="form-group">
                        <label>Логин (username в Telegram)</label>
                        <input type="text" id="username-input" placeholder="@username или username">
                    </div>
                    <div class="form-group">
                        <label>Пароль</label>
                        <input type="password" id="password-input" placeholder="Пароль из бота">
                    </div>
                    <div id="login-error" style="color: var(--danger); font-size: 0.9rem; margin-bottom: 1rem; display: none;"></div>
                    <button class="btn" onclick="login()" style="width: 100%;">Войти</button>
                </div>
            `;
            document.getElementById('loading').style.display = 'none';
        }
        
        async function login() {
            const username = document.getElementById('username-input').value.trim();
            const password = document.getElementById('password-input').value;
            const errorDiv = document.getElementById('login-error');
            
            errorDiv.style.display = 'none';
            
            try {
                const response = await fetch(`${API_BASE}/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (!data.success) {
                    errorDiv.textContent = data.error || 'Ошибка входа';
                    errorDiv.style.display = 'block';
                    return;
                }
                
                // Сохраняем данные
                telegramId = data.telegram_id;
                facultyId = data.faculty_id;
                localStorage.setItem('admin_telegram_id', telegramId);
                localStorage.setItem('admin_faculty_id', facultyId);
                localStorage.setItem('admin_username', username);
                
                // Перезагружаем страницу
                location.reload();
            } catch (error) {
                errorDiv.textContent = `Ошибка: ${error.message}`;
                errorDiv.style.display = 'block';
            }
        }
        
        async function loadData() {
            try {
                const response = await fetch(`${API_BASE}/interviewers/${facultyId}?telegram_id=${telegramId}`);
                if (!response.ok) throw new Error('Ошибка загрузки');
                
                const data = await response.json();
                interviewers = data.interviewers;
                document.getElementById('facultyName').textContent = data.faculty_name;
                
                if (interviewers.length === 0) {
                    document.getElementById('content').innerHTML = '<p style="text-align: center; padding: 3rem; color: var(--text-muted);">Нет проводящих. Добавьте первого проводящего.</p>';
                    document.getElementById('content').style.display = 'block';
                    document.getElementById('loading').style.display = 'none';
                    return;
                }
                
                renderTabs();
                if (interviewers.length > 0) {
                    currentInterviewerId = interviewers[0].id;
                    loadSchedule(interviewers[0].id);
                }
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
            } catch (error) {
                document.getElementById('loading').innerHTML = `Ошибка: ${error.message}`;
            }
        }
        
        function renderTabs() {
            const tabsContainer = document.getElementById('tabs');
            const contentsContainer = document.getElementById('tabContents');
            
            tabsContainer.innerHTML = '';
            contentsContainer.innerHTML = '';
            
            interviewers.forEach((interviewer, index) => {
                // Tab button
                const tab = document.createElement('div');
                tab.className = `tab ${index === 0 ? 'active' : ''}`;
                const name = interviewer.name || interviewer.full_name || interviewer.username || `ID ${interviewer.telegram_id}`;
                const roleBadge = interviewer.role === 'head_admin' ? '👑 ' : '👤 ';
                tab.textContent = roleBadge + name;
                tab.onclick = () => switchTab(interviewer.id);
                tabsContainer.appendChild(tab);
                
                // Tab content
                const content = document.createElement('div');
                content.className = `tab-content ${index === 0 ? 'active' : ''}`;
                content.id = `tab-${interviewer.id}`;
                content.innerHTML = '<div class="loading"><div class="spinner"></div> Загрузка расписания...</div>';
                contentsContainer.appendChild(content);
            });
        }
        
        function switchTab(interviewerId) {
            currentInterviewerId = interviewerId;
            
            // Update tabs
            document.querySelectorAll('.tab').forEach((tab, index) => {
                if (interviewers[index].id === interviewerId) {
                    tab.classList.add('active');
                } else {
                    tab.classList.remove('active');
                }
            });
            
            // Update contents
            document.querySelectorAll('.tab-content').forEach((content) => {
                if (content.id === `tab-${interviewerId}`) {
                    content.classList.add('active');
                } else {
                    content.classList.remove('active');
                }
            });
            
            loadSchedule(interviewerId);
        }
        
        async function loadSchedule(interviewerId) {
            const contentDiv = document.getElementById(`tab-${interviewerId}`);
            contentDiv.innerHTML = '<div class="loading"><div class="spinner"></div> Загрузка расписания...</div>';
            
            try {
                const startDate = '2026-02-02';
                const endDate = '2026-02-07';
                const response = await fetch(
                    `${API_BASE}/interviewers/${interviewerId}/schedule?start_date=${startDate}&end_date=${endDate}&telegram_id=${telegramId}`
                );
                
                if (!response.ok) throw new Error('Ошибка загрузки расписания');
                
                const data = await response.json();
                
                // Создаём карту расписания
                const scheduleMap = {};
                data.slots.forEach(slot => {
                    const key = `${slot.date}_${slot.time}`;
                    scheduleMap[key] = slot;
                });
                
                scheduleData[interviewerId] = scheduleMap;
                
                renderSchedule(interviewerId, scheduleMap);
            } catch (error) {
                contentDiv.innerHTML = `<div class="error">Ошибка: ${error.message}</div>`;
            }
        }
        
        function renderSchedule(interviewerId, scheduleMap) {
            const contentDiv = document.getElementById(`tab-${interviewerId}`);
            
            // Находим текущего проводящего
            const currentInterviewer = interviewers.find(i => i.id === interviewerId);
            const displayName = currentInterviewer ? (currentInterviewer.name || currentInterviewer.full_name || currentInterviewer.username || `ID ${currentInterviewer.telegram_id}`) : '';
            
            let html = '<div class="schedule-container">';
            html += '<div style="padding: 1.5rem; border-bottom: 1px solid var(--border);">';
            html += '<div style="display: flex; justify-content: space-between; align-items: center;">';
            html += `<h3 style="margin: 0;">${displayName}</h3>`;
            html += '<button class="btn btn-secondary" onclick="showEditNameModal(' + interviewerId + ')" style="padding: 0.5rem 1rem; font-size: 0.85rem;">✏️ Изменить имя</button>';
            html += '</div>';
            html += '</div>';
            html += '<div class="schedule-table-wrapper">';
            html += '<table class="schedule-table">';
            
            // Header: даты
            html += '<thead><tr><th>Время</th>';
            dates.forEach(date => {
                const dayName = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'][date.getDay()];
                html += `<th>${date.getDate()}.${date.getMonth() + 1}<br>${dayName}</th>`;
            });
            html += '</tr></thead>';
            
            // Body: время и ячейки
            html += '<tbody>';
            timeSlots.forEach(timeSlot => {
                html += '<tr>';
                html += `<td>${timeSlot.time}</td>`;
                
                dates.forEach(date => {
                    const dateStr = date.toISOString().split('T')[0];
                    const key = `${dateStr}_${timeSlot.time}`;
                    const slot = scheduleMap[key];
                    
                    let cellClass = 'empty';
                    let cellText = '';
                    
                    if (slot) {
                        cellClass = slot.is_available ? 'available' : 'busy';
                        cellText = slot.is_available ? '✓ Может' : '✗ Занят';
                        if (slot.is_after_interview) {
                            cellClass += ' after-interview';
                        }
                    } else {
                        cellText = 'Клик';
                    }
                    
                    const tooltip = slot 
                        ? (slot.is_available ? 'Может проводить собесы' : 'Занят, не может')
                        : 'Кликните чтобы отметить';
                    html += `<td onclick="toggleSlot(${interviewerId}, '${dateStr}', '${timeSlot.time}', ${timeSlot.isAfterInterview})" title="${tooltip}">`;
                    html += `<div class="schedule-cell ${cellClass}">${cellText}</div>`;
                    html += '</td>';
                });
                
                html += '</tr>';
            });
            html += '</tbody>';
            html += '</table>';
            html += '</div>';
            html += '<div style="padding: 1.5rem; border-top: 1px solid var(--border);">';
            html += '<div style="margin-bottom: 1rem; padding: 1rem; background: rgba(99, 102, 241, 0.1); border-radius: 8px; font-size: 0.85rem;">';
            html += '<strong>Легенда:</strong><br>';
            html += '<span style="color: var(--success);">✓ Зелёный</span> — может проводить собесы в это время<br>';
            html += '<span style="color: var(--danger);">✗ Красный</span> — занят, не может<br>';
            html += '<span style="color: var(--text-muted);">Пусто</span> — не отмечено<br>';
            html += '<span style="color: var(--warning);">Жёлтая рамка</span> — время после собес (20:00-21:00)<br><br>';
            html += '<strong>Как использовать:</strong> Кликните на ячейку, чтобы отметить когда проводящий может/не может проводить собесы. Затем нажмите "Сохранить".';
            html += '</div>';
            html += '<button class="btn save-btn" onclick="saveSchedule(' + interviewerId + ')">💾 Сохранить расписание</button>';
            html += '</div>';
            html += '</div>';
            
            contentDiv.innerHTML = html;
        }
        
        function toggleSlot(interviewerId, date, time, isAfterInterview) {
            const key = `${date}_${time}`;
            if (!scheduleData[interviewerId]) {
                scheduleData[interviewerId] = {};
            }
            
            const current = scheduleData[interviewerId][key];
            if (current) {
                // Переключаем доступность: свободен ↔ занят
                current.is_available = !current.is_available;
            } else {
                // Создаём новый слот (по умолчанию "может" = свободен)
                scheduleData[interviewerId][key] = {
                    date: date,
                    time: time,
                    is_available: true,  // true = может проводить собесы
                    is_after_interview: isAfterInterview
                };
            }
            
            renderSchedule(interviewerId, scheduleData[interviewerId]);
        }
        
        async function saveSchedule(interviewerId) {
            const scheduleMap = scheduleData[interviewerId] || {};
            const slots = Object.values(scheduleMap);
            
            try {
                const response = await fetch(
                    `${API_BASE}/interviewers/${interviewerId}/schedule?telegram_id=${telegramId}`,
                    {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ slots })
                    }
                );
                
                if (!response.ok) throw new Error('Ошибка сохранения');
                
                alert('Расписание сохранено!');
                loadSchedule(interviewerId); // Перезагружаем для синхронизации
            } catch (error) {
                alert(`Ошибка: ${error.message}`);
            }
        }
        
        function showAddModal() {
            document.getElementById('addModal').classList.add('active');
        }
        
        function hideAddModal() {
            document.getElementById('addModal').classList.remove('active');
            document.getElementById('telegramIdInput').value = '';
        }
        
        async function addInterviewer() {
            const telegramIdValue = document.getElementById('telegramIdInput').value;
            if (!telegramIdValue) {
                alert('Введите Telegram ID');
                return;
            }
            
            try {
                const response = await fetch(
                    `${API_BASE}/interviewers/${facultyId}?telegram_id=${telegramId}`,
                    {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ telegram_id: parseInt(telegramIdValue) })
                    }
                );
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Ошибка добавления');
                }
                
                hideAddModal();
                loadData(); // Перезагружаем список
            } catch (error) {
                alert(`Ошибка: ${error.message}`);
            }
        }
        
        let editingInterviewerId = null;
        
        function showEditNameModal(interviewerId) {
            editingInterviewerId = interviewerId;
            const interviewer = interviewers.find(i => i.id === interviewerId);
            document.getElementById('nameInput').value = interviewer?.name || '';
            document.getElementById('editNameModal').classList.add('active');
        }
        
        function hideEditNameModal() {
            document.getElementById('editNameModal').classList.remove('active');
            document.getElementById('nameInput').value = '';
            editingInterviewerId = null;
        }
        
        async function saveName() {
            if (editingInterviewerId === null) return;
            
            const nameValue = document.getElementById('nameInput').value.trim();
            
            try {
                const response = await fetch(
                    `${API_BASE}/interviewers/${editingInterviewerId}/name?telegram_id=${telegramId}`,
                    {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: nameValue || null })
                    }
                );
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Ошибка сохранения');
                }
                
                hideEditNameModal();
                loadData(); // Перезагружаем список
            } catch (error) {
                alert(`Ошибка: ${error.message}`);
            }
        }
        
        // Закрытие модалок по клику вне их
        document.getElementById('addModal').addEventListener('click', (e) => {
            if (e.target.id === 'addModal') {
                hideAddModal();
            }
        });
        
        document.getElementById('editNameModal').addEventListener('click', (e) => {
            if (e.target.id === 'editNameModal') {
                hideEditNameModal();
            }
        });
    </script>
</body>
</html>
