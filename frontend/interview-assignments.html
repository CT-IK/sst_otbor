<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Назначение проводящих на собеседования</title>
    
    <style>
        :root {
            --bg-color: #0f0f23;
            --card-bg: #1a1a2e;
            --text-color: #e4e4e7;
            --text-muted: #71717a;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --border: #27272a;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }
        
        .header h1 {
            font-size: 1.75rem;
            font-weight: 600;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            border: none;
            background: var(--accent);
            color: white;
        }
        
        .btn:hover {
            background: var(--accent-hover);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-secondary {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border);
        }
        
        .btn-secondary:hover {
            border-color: var(--accent);
        }
        
        .interviews-list {
            display: grid;
            gap: 1rem;
        }
        
        .interview-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.2s;
        }
        
        .interview-card:hover {
            border-color: var(--accent);
        }
        
        .interview-card-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }
        
        .interview-info {
            flex: 1;
        }
        
        .interview-info h3 {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }
        
        .interview-meta {
            display: flex;
            gap: 1.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }
        
        .interview-meta span {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }
        
        .interviewers-list {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }
        
        .interviewers-list h4 {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }
        
        .interviewer-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: var(--accent);
            border-radius: 6px;
            font-size: 0.85rem;
            margin-right: 0.5rem;
            margin-bottom: 0.5rem;
        }
        
        .no-interviewers {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-style: italic;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        
        .modal-header h2 {
            font-size: 1.5rem;
        }
        
        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
            width: 2rem;
            height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .close-btn:hover {
            color: var(--text-color);
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 0.9rem;
        }
        
        .form-group select:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        .form-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 2rem;
        }
        
        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
        }
        
        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        
        .success {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📅 Назначение проводящих на собеседования</h1>
            <a href="/admin" class="btn btn-secondary">← Назад</a>
        </div>
        
        <div id="error-container"></div>
        <div id="success-container"></div>
        
        <div id="interviews-container" class="loading">
            Загрузка...
        </div>
    </div>
    
    <!-- Modal для назначения проводящих -->
    <div id="assignModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Назначить проводящих</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            
            <div id="modal-interview-info"></div>
            
            <div class="form-group">
                <label for="interviewer1">Проводящий 1 (обязательно):</label>
                <select id="interviewer1" required>
                    <option value="">Выберите проводящего</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="interviewer2">Проводящий 2 (опционально):</label>
                <select id="interviewer2">
                    <option value="">Не назначать</option>
                </select>
            </div>
            
            <div class="form-actions">
                <button class="btn btn-secondary" onclick="closeModal()">Отмена</button>
                <button class="btn" onclick="confirmAssignment()">Подтвердить</button>
            </div>
        </div>
    </div>
    
    <script>
        const API_BASE = '/api/v1';
        let facultyId = null;
        let telegramId = null;
        let currentInterviewId = null;
        let availableInterviewers = [];
        
        // Получаем параметры из URL
        const urlParams = new URLSearchParams(window.location.search);
        facultyId = urlParams.get('faculty_id');
        telegramId = urlParams.get('telegram_id');
        
        // Или из localStorage
        if (!facultyId) {
            facultyId = localStorage.getItem('faculty_id');
        }
        if (!telegramId) {
            telegramId = localStorage.getItem('telegram_id');
        }
        
        if (!facultyId || !telegramId) {
            document.getElementById('interviews-container').innerHTML = 
                '<div class="error">Не указаны faculty_id или telegram_id</div>';
        } else {
            loadInterviews();
        }
        
        async function loadInterviews() {
            try {
                const response = await fetch(
                    `${API_BASE}/interview-assignments/${facultyId}?telegram_id=${telegramId}`
                );
                
                if (!response.ok) {
                    throw new Error('Ошибка загрузки записей');
                }
                
                const interviews = await response.json();
                renderInterviews(interviews);
            } catch (error) {
                showError('Ошибка загрузки записей: ' + error.message);
                document.getElementById('interviews-container').innerHTML = 
                    '<div class="error">Ошибка загрузки записей</div>';
            }
        }
        
        function renderInterviews(interviews) {
            const container = document.getElementById('interviews-container');
            
            if (interviews.length === 0) {
                container.innerHTML = '<div class="loading">Нет записей на собеседования</div>';
                return;
            }
            
            container.innerHTML = '<div class="interviews-list"></div>';
            const list = container.querySelector('.interviews-list');
            
            interviews.forEach(interview => {
                const card = document.createElement('div');
                card.className = 'interview-card';
                
                const interviewersHtml = interview.interviewers.length > 0
                    ? interview.interviewers.map(i => 
                        `<span class="interviewer-badge">${i.role === 'head_admin' ? '👑' : '👤'} ${i.name}</span>`
                      ).join('')
                    : '<span class="no-interviewers">Не назначены</span>';
                
                card.innerHTML = `
                    <div class="interview-card-header">
                        <div class="interview-info">
                            <h3>${interview.user_fio}</h3>
                            <div class="interview-meta">
                                <span>📅 ${formatDate(interview.date)}</span>
                                <span>🕐 ${interview.time}</span>
                                ${interview.user_username ? `<span>📱 @${interview.user_username}</span>` : ''}
                            </div>
                            ${interview.interviewers.length > 0 ? `
                                <div class="interviewers-list">
                                    <h4>Назначенные проводящие:</h4>
                                    ${interviewersHtml}
                                </div>
                            ` : ''}
                        </div>
                        <button class="btn" onclick="openAssignModal(${interview.id})">
                            ${interview.interviewers.length > 0 ? 'Изменить' : 'Назначить'}
                        </button>
                    </div>
                `;
                
                list.appendChild(card);
            });
        }
        
        async function openAssignModal(interviewId) {
            currentInterviewId = interviewId;
            
            try {
                const response = await fetch(
                    `${API_BASE}/interview-assignments/${interviewId}/detail?telegram_id=${telegramId}`
                );
                
                if (!response.ok) {
                    throw new Error('Ошибка загрузки деталей');
                }
                
                const detail = await response.json();
                availableInterviewers = detail.available_interviewers;
                
                // Заполняем информацию о собеседовании
                document.getElementById('modal-interview-info').innerHTML = `
                    <div class="form-group">
                        <strong>Кандидат:</strong> ${detail.user_fio}<br>
                        <strong>Username:</strong> @${detail.user_username || 'не указан'}<br>
                        <strong>Дата:</strong> ${formatDate(detail.date)}<br>
                        <strong>Время:</strong> ${detail.time}
                    </div>
                `;
                
                // Заполняем выпадающие списки
                const select1 = document.getElementById('interviewer1');
                const select2 = document.getElementById('interviewer2');
                
                select1.innerHTML = '<option value="">Выберите проводящего</option>';
                select2.innerHTML = '<option value="">Не назначать</option>';
                
                availableInterviewers.forEach(interviewer => {
                    const option1 = document.createElement('option');
                    option1.value = interviewer.id;
                    option1.textContent = `${interviewer.role === 'head_admin' ? '👑' : '👤'} ${interviewer.name}`;
                    select1.appendChild(option1);
                    
                    const option2 = document.createElement('option');
                    option2.value = interviewer.id;
                    option2.textContent = `${interviewer.role === 'head_admin' ? '👑' : '👤'} ${interviewer.name}`;
                    select2.appendChild(option2);
                });
                
                // Устанавливаем текущих проводящих
                if (detail.interviewers.length > 0) {
                    select1.value = detail.interviewers[0].id;
                }
                if (detail.interviewers.length > 1) {
                    select2.value = detail.interviewers[1].id;
                }
                
                document.getElementById('assignModal').classList.add('active');
            } catch (error) {
                showError('Ошибка загрузки деталей: ' + error.message);
            }
        }
        
        async function confirmAssignment() {
            const interviewer1 = document.getElementById('interviewer1').value;
            const interviewer2 = document.getElementById('interviewer2').value;
            
            if (!interviewer1) {
                showError('Необходимо выбрать хотя бы одного проводящего');
                return;
            }
            
            const interviewerIds = [parseInt(interviewer1)];
            if (interviewer2) {
                interviewerIds.push(parseInt(interviewer2));
            }
            
            try {
                const response = await fetch(
                    `${API_BASE}/interview-assignments/${currentInterviewId}/assign?telegram_id=${telegramId}`,
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            interviewer_ids: interviewerIds
                        })
                    }
                );
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Ошибка назначения');
                }
                
                showSuccess('Проводящие успешно назначены! Уведомления отправлены.');
                closeModal();
                loadInterviews();
            } catch (error) {
                showError('Ошибка назначения: ' + error.message);
            }
        }
        
        function closeModal() {
            document.getElementById('assignModal').classList.remove('active');
            currentInterviewId = null;
        }
        
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            const days = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
            return `${date.getDate()}.${date.getMonth() + 1} (${days[date.getDay()]})`;
        }
        
        function showError(message) {
            const container = document.getElementById('error-container');
            container.innerHTML = `<div class="error">${message}</div>`;
            setTimeout(() => {
                container.innerHTML = '';
            }, 5000);
        }
        
        function showSuccess(message) {
            const container = document.getElementById('success-container');
            container.innerHTML = `<div class="success">${message}</div>`;
            setTimeout(() => {
                container.innerHTML = '';
            }, 5000);
        }
        
        // Закрытие модального окна по клику вне его
        document.getElementById('assignModal').addEventListener('click', (e) => {
            if (e.target.id === 'assignModal') {
                closeModal();
            }
        });
    </script>
</body>
</html>
